[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "morphace"
version = "0.0.1"
description = "Generate a face-morphing video from two face images"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.TXT"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "dlib==20.0.1",
  "numpy==2.4.6",
  "opencv-python==4.13.0.92",
  "pillow==12.2.0",
  "platformdirs==4.10.0",
  "requests==2.34.2",
  "scipy==1.17.1",
  "tqdm==4.67.3"
]

[project.scripts]
morphace = "morphace.cli.main:main"

[dependency-groups]
dev = [
  "pipdeptree>=2.35.2",
  "pylint>=4.0.5",
  "pyright>=1.1.410",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.13",
]

[tool.hatch.build.targets.wheel]
packages = ["morphace"]

[tool.hatch.build.targets.sdist]
include = [
  "morphace",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=morphace",
  "--cov-branch",
  "--cov-report=html",
]

[tool.coverage.run]
branch = true
source = ["morphace"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "raise AssertionError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
exclude = [
  ".git",
  ".nox",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  ".vscode",
  "build",
  "dist",
  "node_modules",
  "site-packages",
  "venv",
]
line-length = 80
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
  "ANN401", # any-type
  "BLE",    # blind-except
  "COM812", # missing-trailing-comma -- may cause conflicts when used with the formatter
  "FBT001", # boolean-type-hint-positional-argument
  "FBT002", # boolean-default-value-positional-argument
  "S101",   # assert-used -- we use this in tests
  ]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pyright]
include = [
  "morphace",
  "tests",
]
stubPath = "typings"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportMissingModuleSource = false

[tool.pylint.main]
py-version = "3.12"
ignore = ["third_party"]
persistent = false
jobs = 4

[tool.pylint.messages_control]
disable = [
  "R0801",     # Similar lines
  "R0903",     # Too few public methods
  "R0913",     # Too many arguments
  "R0914",     # Too many local variables
  "R0917",     # Too many positional arguments
  "no-member", # Member not found
]

[tool.pylint.basic]
good-names = ["main", "_"]
bad-names = []
property-classes = [
  "abc.abstractproperty",
  "cached_property.cached_property",
  "cached_property.threaded_cached_property",
  "cached_property.cached_property_with_ttl",
  "cached_property.threaded_cached_property_with_ttl",
]
function-rgx = "^(?:(?P<exempt>setUp|tearDown|setUpModule|tearDownModule)|(?P<camel_case>_?[A-Z][a-zA-Z0-9]*)|(?P<snake_case>_?[a-z][a-z0-9_]*))$"
variable-rgx = "^[a-z][a-z0-9_]*$"
const-rgx = "^(_?[A-Z][A-Z0-9_]*|__[a-z0-9_]+__|_?[a-z][a-z0-9_]*)$"
attr-rgx = "^_{0,2}[a-z][a-z0-9_]*$"
argument-rgx = "^[a-z][a-z0-9_]*$"
class-attribute-rgx = "^(_?[A-Z][A-Z0-9_]*|__[a-z0-9_]+__|_?[a-z][a-z0-9_]*)$"
inlinevar-rgx = "^[a-z][a-z0-9_]*$"
class-rgx = "^_?[A-Z][a-zA-Z0-9]*$"
module-rgx = "^(_?[a-z][a-z0-9_]*|__init__)$"
method-rgx = '''(?x)^(?:(?P<exempt>_[a-z0-9_]+__|runTest|setUp|tearDown|setUpTestCase|tearDownTestCase|setupSelf|tearDownClass|setUpClass|(test|assert)_*[A-Z0-9][a-zA-Z0-9_]*|next)|(?P<camel_case>_{0,2}[A-Z][a-zA-Z0-9_]*)|(?P<snake_case>_{0,2}[a-z][a-z0-9_]*))$'''
no-docstring-rgx = "(__.*__|main|test.*|.*test|.*Test)$"
docstring-min-length = 12

[tool.pylint.format]
max-line-length = 80
ignore-long-lines = '''(?x)(
  ^\s*(\#\ )?<?https?://\S+>?$|
  ^\s*(from\s+\S+\s+)?import\s+.+$)'''
single-line-if-stmt = true
max-module-lines = 99999

[tool.pylint.miscellaneous]
notes = ["TODO"]

[tool.pylint.string]
check-quote-consistency = true

[tool.pylint.variables]
dummy-variables-rgx = "^\\*{0,2}(_$|unused_|dummy_)"

[tool.pylint.logging]
logging-modules = ["logging"]

[tool.pylint.similarities]
ignore-imports = false

[tool.pylint.imports]
analyse-fallback-blocks = false

[tool.pylint.classes]
valid-classmethod-first-arg = [
  "cls",
  "class_",
]
