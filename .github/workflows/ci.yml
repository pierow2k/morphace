
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website / Node 24
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Set up npm
        run: npm install --global npm@11.19.1

      - name: Install website dependencies
        run: npm ci

      - name: Audit website dependencies
        run: npm audit --include=dev --audit-level=low

      - name: Smoke-test website development server
        timeout-minutes: 2
        shell: bash
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          WRANGLER_SEND_METRICS: "false"
          CLOUDFLARE_CF_FETCH_ENABLED: "false"
        run: |
          set -euo pipefail
          # Give npm and its children a process group for reliable cleanup.
          set -m
          smoke_dir=$(mktemp -d)
          dev_pid=
          cleanup() {
            result=$?
            trap - EXIT
            if [[ -n "$dev_pid" ]]; then
              kill -TERM -- "-$dev_pid" 2>/dev/null || true
              sleep 1
              kill -KILL -- "-$dev_pid" 2>/dev/null || true
              wait "$dev_pid" 2>/dev/null || true
            fi
            if (( result != 0 )); then
              cat "$smoke_dir/dev.log"
            fi
            rm -rf "$smoke_dir"
            exit "$result"
          }
          trap cleanup EXIT

          # npm ci supplies a cold Vite cache for this startup check.
          npm run dev -- --ignore-lock --host 127.0.0.1 --port 4328 \
            >"$smoke_dir/dev.log" 2>&1 &
          dev_pid=$!
          deadline=$((SECONDS + 60))
          ready=false
          while (( SECONDS < deadline )); do
            if ! kill -0 "$dev_pid" 2>/dev/null; then
              echo "Development server exited before becoming ready."
              exit 1
            fi
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:4328/ >"$smoke_dir/home.html"; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Development server did not become ready within 60 seconds."
            exit 1
          fi
          grep -Fq '<title>Morphace | Face Morphing Video Generator</title>' \
            "$smoke_dir/home.html"
          curl --fail --silent --show-error --max-time 10 \
            http://127.0.0.1:4328/documentation/ >"$smoke_dir/docs.html"
          grep -Fq '<title>Morphace Documentation | Morphace</title>' \
            "$smoke_dir/docs.html"
          kill -0 "$dev_pid"

      - name: Check website
        run: npm run check

      - name: Build website
        run: npm run build

  check:
    name: Checks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Cache pip downloads and compiled wheels separately
      # for each Python version.
      - name: Restore pip cache
        id: pip-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/pip
          key: pip-v1-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml', 'requirements*.txt') }}
          restore-keys: |
            pip-v1-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ffmpeg \
            libgl1

      - name: Install Python dependencies
        env:
          # Preserve single-threaded dlib compilation for stability.
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .

      # Save compiled wheels before running tests so that
      # subsequent lint or test failures don't discard them.
      - name: Save pip cache
        if: steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check

      - name: Pylint
        id: pylint
        continue-on-error: true
        run: pylint ./morphace/ ./tests/

      - name: Pyright
        id: pyright
        continue-on-error: true
        run: pyright

      - name: Pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest \
            --cov=morphace \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: ${{ always() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if any check failed
        if: >-
          ${{
            steps.ruff.outcome == 'failure' ||
            steps.pylint.outcome == 'failure' ||
            steps.pyright.outcome == 'failure' ||
            steps.pytest.outcome == 'failure'
          }}
        run: |
          echo "One or more checks failed:"
          echo "  ruff:   ${{ steps.ruff.outcome }}"
          echo "  pylint: ${{ steps.pylint.outcome }}"
          echo "  pyright:${{ steps.pyright.outcome }}"
          echo "  pytest: ${{ steps.pytest.outcome }}"
          exit 1
