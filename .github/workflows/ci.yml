name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ffmpeg \
            libgl1

      - name: Install Python dependencies
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: ruff check

      - name: Pylint
        id: pylint
        continue-on-error: true
        run: pylint ./morphace/ ./tests/

      - name: Pyright
        id: pyright
        continue-on-error: true
        run: pyright

      - name: Pytest
        id: pytest
        continue-on-error: true
        run: |
          pytest \
            --cov=morphace \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: ${{ always() && steps.pytest.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail if any check failed
        if: >-
          ${{
            steps.ruff.outcome == 'failure' ||
            steps.pylint.outcome == 'failure' ||
            steps.pyright.outcome == 'failure' ||
            steps.pytest.outcome == 'failure'
          }}
        run: |
          echo "One or more checks failed:"
          echo "  ruff:   ${{ steps.ruff.outcome }}"
          echo "  pylint: ${{ steps.pylint.outcome }}"
          echo "  pyright:${{ steps.pyright.outcome }}"
          echo "  pytest: ${{ steps.pytest.outcome }}"
          exit 1
