
name: Dependabot Auto-merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable Dependabot auto-merge
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event.pull_request.user.login == 'dependabot[bot]' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      - name: Explain metadata verification failure
        if: ${{ failure() && steps.metadata.outcome == 'failure' }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Dependabot verification failed

          Auto-merge was not enabled. Inspect the metadata step's log for
          the verification error. Maintainer-edited or unsigned commits
          should be regenerated by Dependabot so its signatures can be
          verified. Do not disable signature verification to merge them.
          EOF

      - name: Enable auto-merge for patch and minor updates
        if: >-
          ${{
            success() &&
            (
              steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
              steps.metadata.outputs.update-type == 'version-update:semver-minor'
            )
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"
