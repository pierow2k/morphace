version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "direct"
    groups:
      direct-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    groups:
      astro-stack:
        patterns:
          - "astro"
          - "@astrojs/cloudflare"
          - "@astrojs/starlight"
          - "@astrojs/starlight-tailwind"
          - "wrangler"
        update-types:
          - "patch"
          - "minor"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "patch"
          - "minor"
      tooling:
        patterns:
          - "@astrojs/check"
          - "typescript"
        update-types:
          - "patch"
          - "minor"
